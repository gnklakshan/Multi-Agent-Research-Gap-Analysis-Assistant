[project]
name = "citation-grounded-research-gap-assistant"
version = "0.1.0"
description = "Citation-grounded multi-agent research gap analysis assistant (LangGraph + RAG + FAISS + OpenAI)"
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langchain-openai",
    "langchain-community",
    "langgraph",
    "langchain-text-splitters",
    "python-dotenv",
    "tiktoken",
    "faiss-cpu",
    "requests",
    "pydantic",
    "pydantic-settings",
    "pymupdf",
    "rich",
    "pandas",
    "fastapi",
    "uvicorn",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
